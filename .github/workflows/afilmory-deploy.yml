name: Deploy Afilmory Photos

on:
  push:
    branches:
      - main
    paths:
      - afilmory/**
      - .github/workflows/afilmory-deploy.yml
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: afilmory-production
  cancel-in-progress: true

env:
  AFILMORY_REF: 6e54714681b1588aa3980ada030683941dfcd2bf
  NODE_VERSION: '24'
  PNPM_VERSION: 11.1.2

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout configuration
        uses: actions/checkout@v7
        with:
          path: config-repo

      - name: Checkout Afilmory
        uses: actions/checkout@v7
        with:
          repository: Afilmory/afilmory
          ref: ${{ env.AFILMORY_REF }}
          path: afilmory-source

      - name: Apply configuration
        run: |
          cp config-repo/afilmory/builder.config.ts afilmory-source/
          cp config-repo/afilmory/config.json afilmory-source/
          cp config-repo/afilmory/apps/web/wrangler.jsonc afilmory-source/apps/web/

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: afilmory-source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: afilmory-source
        run: pnpm install --frozen-lockfile

      - name: Build photos manifest
        working-directory: afilmory-source
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: pnpm build:manifest

      - name: Build web application
        working-directory: afilmory-source/apps/web
        run: pnpm exec vite build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: pnpm
          wranglerVersion: 4.110.0
          workingDirectory: afilmory-source/apps/web
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=main
